user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS — resolve upstreams at request time so nginx can
    # boot even if a container is briefly unavailable.
    resolver 127.0.0.11 ipv6=off valid=10s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    client_max_body_size 25m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    server {
        listen 80;
        server_name _;

        # ── tRPC admin API ────────────────────────────────
        location /trpc/ {
            set $upstream_admin admin:7780;
            proxy_pass http://$upstream_admin;
        }

        # ── better-auth REST API ──────────────────────────
        location /api/auth/ {
            set $upstream_admin_auth admin:7780;
            proxy_pass http://$upstream_admin_auth;
        }

        # ── gemini OAuth callback (admin handles loopback redirect) ─
        location /oauth/ {
            set $upstream_admin_oauth admin:7780;
            proxy_pass http://$upstream_admin_oauth;
        }

        # ── LLM proxy ─────────────────────────────────────
        location /v1/ {
            set $upstream_proxy proxy:7777;
            proxy_pass http://$upstream_proxy;
        }

        location = /healthz {
            set $upstream_proxy_health proxy:7777;
            proxy_pass http://$upstream_proxy_health;
        }
        location = /readyz {
            set $upstream_proxy_ready proxy:7777;
            proxy_pass http://$upstream_proxy_ready;
        }

        # ── dashboard (Next.js) ───────────────────────────
        location / {
            set $upstream_dashboard dashboard:7790;
            proxy_pass http://$upstream_dashboard;
        }
    }
}
