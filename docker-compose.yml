services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-gateway-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_gateway_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ai_gateway}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ai_gateway} -d ${POSTGRES_DB:-ai_gateway}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot tools container for pnpm install / drizzle migrate / seed.
  # Bring up via `docker compose run --rm db-tools <command>`.
  # Source bind-mounted; node_modules cached in a named volume so installs persist
  # across `docker compose run` invocations.
  db-tools:
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    image: ai-gateway/tools:latest
    container_name: ai-gateway-tools
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_gateway}:${POSTGRES_PASSWORD:-ai_gateway_dev}@postgres:5432/${POSTGRES_DB:-ai_gateway}
      REDIS_URL: redis://redis:6379
      CONFIG_SOURCE: db
      TENANT_SLUG: ${TENANT_SLUG:-default}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
      NEXT_PUBLIC_ADMIN_URL: http://localhost:7780
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRETTY_LOGS: "1"
      CI: "1"
    profiles: ["tools"]

  proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    image: ai-gateway/proxy:latest
    container_name: ai-gateway-proxy
    ports:
      - "7777:7777"
    environment:
      CONFIG_SOURCE: ${CONFIG_SOURCE:-db}
      CONFIG_PATH: /etc/ai-gateway/config.toml
      TENANT_SLUG: ${TENANT_SLUG:-default}
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_gateway}:${POSTGRES_PASSWORD:-ai_gateway_dev}@postgres:5432/${POSTGRES_DB:-ai_gateway}
      REDIS_URL: redis://redis:6379
      PORT: "7777"
      HOST: "0.0.0.0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      KIRO_ACCOUNTS_DIR: /var/kiro-accounts
      GEMINI_ACCOUNTS_DIR: /var/gemini-accounts
      GEMINI_OAUTH_CLIENT_ID: ${GEMINI_OAUTH_CLIENT_ID:-}
      GEMINI_OAUTH_CLIENT_SECRET: ${GEMINI_OAUTH_CLIENT_SECRET:-}
    volumes:
      - ./config.toml:/etc/ai-gateway/config.toml:ro
      - kiro_accounts:/var/kiro-accounts
      - gemini_accounts:/var/gemini-accounts
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7777/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["app"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: ai-gateway/admin:latest
    container_name: ai-gateway-admin
    ports:
      - "7780:7780"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_gateway}:${POSTGRES_PASSWORD:-ai_gateway_dev}@postgres:5432/${POSTGRES_DB:-ai_gateway}
      REDIS_URL: redis://redis:6379
      TENANT_SLUG: ${TENANT_SLUG:-default}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
      PORT: "7780"
      HOST: "0.0.0.0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      KIRO_ACCOUNTS_DIR: /var/kiro-accounts
      GEMINI_ACCOUNTS_DIR: /var/gemini-accounts
      GEMINI_OAUTH_CLIENT_ID: ${GEMINI_OAUTH_CLIENT_ID:-}
      GEMINI_OAUTH_CLIENT_SECRET: ${GEMINI_OAUTH_CLIENT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:7780}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:7790,http://127.0.0.1:7790,http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LEGACY_ADMIN_TOKEN_FALLBACK: ${LEGACY_ADMIN_TOKEN_FALLBACK:-0}
    volumes:
      - kiro_accounts:/var/kiro-accounts
      - gemini_accounts:/var/gemini-accounts
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7780/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["app"]

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: ai-gateway/dashboard:latest
    container_name: ai-gateway-dashboard
    ports:
      - "7790:7790"
    environment:
      NEXT_PUBLIC_ADMIN_URL: ${DASHBOARD_ADMIN_URL:-http://192.168.1.8}
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7790/"]
      interval: 30s
      timeout: 5s
      retries: 5
    profiles: ["app"]

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-gateway-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - dashboard
      - admin
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["app"]

volumes:
  postgres_data:
  redis_data:
  kiro_accounts:
  gemini_accounts:
